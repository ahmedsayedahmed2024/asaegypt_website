{% extends "base.html" %}
{% block main %}
<section class="page-hero" style="min-height:80vh;display:flex;align-items:center">{{ MARK_BG|safe }}
  <div class="wrap"><p class="kicker">404</p><h1>Page not found<br><span lang="ar" style="font-family:var(--f-ar)">الصفحة غير موجودة</span></h1>
  <div class="ctas"><a class="btn btn-primary" href="/">Home</a><a class="btn btn-ghost" href="/ar/" lang="ar">الرئيسية</a></div>
  <div class="nf-search">
    <form class="sp-form sp-form-dark" role="search" action="/search/" method="get">
      <span class="sp-ico">{{ I('Search') }}</span>
      <input class="sp-input" type="search" name="q" placeholder="{{ T.search.label }}…" aria-label="{{ T.search.label }}" enterkeyhint="search">
      <button class="btn btn-primary sp-go" type="submit">{{ T.search.go }}</button>
    </form>
    <form class="sp-form sp-form-dark" role="search" action="/ar/search/" method="get" lang="ar" dir="rtl">
      <span class="sp-ico">{{ I('Search') }}</span>
      <input class="sp-input" type="search" name="q" placeholder="{{ S_AR.label }}…" aria-label="{{ S_AR.label }}" enterkeyhint="search">
      <button class="btn btn-primary sp-go" type="submit">{{ S_AR.go }}</button>
    </form>
  </div></div>
</section>
{% endblock %}
